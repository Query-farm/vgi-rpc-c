site_name: vgi-rpc C
site_description: C11 clients and servers for the Arrow IPC RPC protocol, built with nanoarrow.
site_url: https://vgi-rpc-c.pages.dev/
repo_url: https://github.com/Query-farm/vgi-rpc-c
repo_name: Query-farm/vgi-rpc-c
edit_uri: edit/main/docs/
copyright: '&copy; 2026 <a href="https://query.farm">Query Farm LLC</a> · <a href="https://github.com/Query-farm/vgi-rpc-c/blob/main/LICENSE">Query Farm Source-Available License</a>'

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo-shield.png
  favicon: assets/favicon.ico
  font:
    text: Noto Sans
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.action.edit
    - content.code.copy
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css
extra:
  social:
    - icon: material/web
      link: https://vgi-rpc.query.farm
      name: All vgi-rpc implementations
    - icon: fontawesome/brands/github
      link: https://github.com/Query-farm/vgi-rpc-c
      name: Source on GitHub
    - icon: material/web
      link: https://query.farm
      name: Query.Farm

plugins:
  - search
markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true

validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Get started:
      - getting-started.md
      - Build and install: building.md
      - Calculator example: examples.md
  - Guides:
      - Server handlers and streams: server.md
      - Native clients: client.md
      - HTTP hosting and identity: hosting.md
      - Shared memory: shared-memory.md
      - Worker pools: pooling.md
      - OpenTelemetry: telemetry.md
  - API reference:
      - api/index.md
      - Server and methods: api/server.md
      - Client: api/client.md
      - Arrow batches and IPC: api/arrow.md
      - HTTP and identity: api/http.md
      - External payloads: api/external.md
      - Shared memory and pools: api/local.md
      - Telemetry: api/telemetry.md
  - Development:
      - Conformance: conformance.md
      - Documentation site: contributing-docs.md
