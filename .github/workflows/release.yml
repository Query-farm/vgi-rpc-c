name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the CMake version
        run: |
          version=$(sed -n 's/^project(vgi-rpc-c VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match CMake version $version" >&2
            exit 1
          fi

      - name: Create source tarball
        run: |
          git archive --format=tar.gz --prefix="vgi-rpc-c-${GITHUB_REF_NAME}/" \
            -o "vgi-rpc-c-${GITHUB_REF_NAME}.tar.gz" HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: vgi-rpc-c-*.tar.gz
