[project]
name = "vgi-rpc-c-conformance"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["vgi-rpc[http,conformance]", "pytest", "pytest-timeout", "ruff"]

[tool.pytest.ini_options]
addopts = "-p no:randomly"
testpaths = ["tests/conformance"]
timeout = 50

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
